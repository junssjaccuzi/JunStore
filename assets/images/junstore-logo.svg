<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 65" width="260" height="65">
  <defs>
    <!-- Purple to Cyan Brush Gradient ala Image 2 -->
    <linearGradient id="rendraJGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d4edd" />
      <stop offset="45%" stop-color="#7928ca" />
      <stop offset="85%" stop-color="#3a86ff" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Subtle Drop Shadow for Gaming Depth -->
    <filter id="rendraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7928ca" flood-opacity="0.45" />
    </filter>
  </defs>

  <g filter="url(#rendraGlow)">
    <!-- STYLIZED BRUSH STROKE "J" ICON -->
    <!-- Top Horizontal Crossbar with Dynamic Angled Brush Ends -->
    <path d="M 14,14 C 18,13 38,11 48,13 C 51,13.5 50,19 46,19 C 36,19.5 22,20 15,20.5 C 12,20.5 12,14.5 14,14 Z" 
          fill="url(#rendraJGrad)" />
    
    <!-- Main Vertical Stem & Curved Hook of 'J' with Brush Texture & Taper -->
    <path d="M 37,14 
             C 41,14 42,18 41,24
             L 39,38
             C 38,47 33,56 22,57
             C 12,58 4,52 4,45
             C 4,39 9,35 15,35
             C 19,35 22,38 22,42
             C 22,46 18,48 15,48
             C 13,48 12,47 12,46
             C 12,47 14,50 19,50
             C 24,50 28,46 29,39
             L 31,23
             C 31,18 34,14 37,14 Z" 
          fill="url(#rendraJGrad)" />

    <!-- Secondary Brush Accent Specks on Tail (Like Grunge/Brush in Image 2) -->
    <path d="M 3,49 C 1,51 2,54 4,53 C 6,52 5,48 3,49 Z" fill="#3a86ff" opacity="0.8" />
    <path d="M 21,58 C 23,60 26,59 25,57 C 24,55 22,56 21,58 Z" fill="#00f2fe" opacity="0.75" />

    <!-- 3 WHITE SPARKLES / STARS (Top-Right of Mark ala Image 2) -->
    <!-- Large Star -->
    <path d="M 46,6 Q 46,12 40,12 Q 46,12 46,18 Q 46,12 52,12 Q 46,12 46,6 Z" fill="#ffffff" />
    <!-- Medium Star -->
    <path d="M 53,16 Q 53,20 49,20 Q 53,20 53,24 Q 53,20 57,20 Q 53,20 53,16 Z" fill="#ffffff" />
    <!-- Small Tiny Star -->
    <path d="M 40,19 Q 40,21 38,21 Q 40,21 40,23 Q 40,21 42,21 Q 40,21 40,19 Z" fill="#ffffff" opacity="0.9" />

    <!-- TYPOGRAPHY: "unStore" (Combining with 'J' to form "JunStore") -->
    <!-- Styled in Modern Geometric Bold Rounded Sans-Serif (Matching 'cashshop' in Image 2) -->
    <g fill="#ffffff">
      <!-- Letter 'u' -->
      <path d="M 64,28 L 71,28 L 71,43 C 71,46 73,48 76,48 C 79,48 81,46 81,43 L 81,28 L 88,28 L 88,43 C 88,51 82,55 76,55 C 70,55 64,51 64,43 Z" />
      
      <!-- Letter 'n' -->
      <path d="M 95,28 L 102,28 L 102,33 C 104,29 108,27 113,27 C 119,27 123,31 123,38 L 123,54 L 116,54 L 116,40 C 116,36 114,34 110,34 C 106,34 102,37 102,42 L 102,54 L 95,54 Z" />
      
      <!-- Letter 'S' (Capital & Prominent) -->
      <path d="M 134,48 C 136,50 139,51 143,51 C 147,51 150,49 150,46 C 150,43 147,42 142,40 C 134,37 129,34 129,27 C 129,20 135,15 144,15 C 149,15 154,17 157,20 L 153,25 C 150,23 147,21 143,21 C 139,21 136,23 136,26 C 136,28 138,29 143,31 C 151,33 157,36 157,44 C 157,51 151,57 142,57 C 136,57 130,54 126,50 Z" />

      <!-- Letter 't' -->
      <path d="M 166,22 L 166,28 L 172,28 L 172,34 L 166,34 L 166,46 C 166,48 167,49 169,49 C 170,49 171,49 172,48 L 174,54 C 172,55 169,55 166,55 C 161,55 159,52 159,46 L 159,34 L 154,34 L 154,28 L 159,28 L 159,22 Z" />

      <!-- Letter 'o' -->
      <path d="M 178,41 C 178,32 184,27 192,27 C 200,27 206,32 206,41 C 206,50 200,55 192,55 C 184,55 178,50 178,41 Z M 185,41 C 185,46 188,49 192,49 C 196,49 199,46 199,41 C 199,36 196,33 192,33 C 188,33 185,36 185,41 Z" />

      <!-- Letter 'r' -->
      <path d="M 213,28 L 220,28 L 220,33 C 222,29 226,27 230,27 C 232,27 233,27.5 234,28 L 232,35 C 230,34 228,34 226,34 C 222,34 220,37 220,42 L 220,54 L 213,54 Z" />

      <!-- Letter 'e' -->
      <path d="M 238,41 C 238,32 244,27 252,27 C 259,27 265,32 265,40 C 265,41.5 264.8,42.5 264.5,43 L 245,43 C 245.5,47 248.5,49.5 252.5,49.5 C 255.5,49.5 258,48.5 260,47 L 263,52 C 260,54 256.5,55.5 252,55.5 C 243.5,55.5 238,50 238,41 Z M 252,33 C 248,33 245.5,35.5 245,38.5 L 258,38.5 C 257.5,35.5 255.5,33 252,33 Z" />
    </g>
  </g>
</svg>
