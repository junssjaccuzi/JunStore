<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 40" width="100" height="40">
  <!-- QRIS Official Logo Style -->
  <rect width="100" height="40" fill="#ffffff" rx="4"/>
  <!-- QR Box graphic -->
  <rect x="8" y="10" width="18" height="18" fill="#1e1e1e" rx="2"/>
  <rect x="11" y="13" width="12" height="12" fill="#ffffff" rx="1"/>
  <rect x="14" y="16" width="6" height="6" fill="#ea2027"/>
  <!-- Text QRIS -->
  <text x="32" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#1e1e1e" letter-spacing="0.5">QRIS</text>
  <path d="M 32 30 L 78 30" stroke="#ea2027" stroke-width="2" stroke-linecap="round"/>
</svg>
